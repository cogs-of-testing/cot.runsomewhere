name: Release

on:
  push:
    tags: ["v*"]
  # started by release-tag.yml, whose tag does not trigger `push`
  workflow_dispatch:

permissions: {}

jobs:
  build:
    # a dispatch on a branch would build a dev version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # hatch-vcs derives the version from tags

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.14"
          # A release builds from a clean slate: a restored cache is one more
          # thing that could influence what ends up on PyPI.
          enable-cache: false

      # The tag is what the version comes from, so a release must not ship a
      # tree that fails its own suite.
      - run: uv run --frozen pytest -q

      - run: uv build

      # A wheel that cannot be imported from a clean environment is the one
      # failure mode the test suite cannot see.
      - name: smoke-test the built wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import cot.runsomewhere; print(cot.runsomewhere.__name__)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
