[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling", "vcs-versioning>=2.6" ]

[project]
name = "cot.runsomewhere"
description = "Run parts of a software system somewhere else, connect them, and deploy them where needed"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "Ronny Pfannschmidt", email = "opensource@ronnypfannschmidt.de" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AnyIO",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Distributed Computing",
]
dynamic = [ "version" ]
# runtime dependencies stay pure Python: bootstrapping ships them as wheels
dependencies = [
  "anyio>=4.10",
  "exceptiongroup>=1.2; python_version<'3.11'",
]
urls.Documentation = "https://github.com/cogs-of-testing/cot.runsomewhere/tree/main/docs"
urls.Source = "https://github.com/cogs-of-testing/cot.runsomewhere"
scripts.runsomewhere = "cot.runsomewhere._cli:main"
entry-points."cot.runsomewhere.places".container = "cot.runsomewhere._places:Container"
entry-points."cot.runsomewhere.places".inloop = "cot.runsomewhere.testing._inloop:InLoop"
entry-points."cot.runsomewhere.places".process = "cot.runsomewhere._places:Process"
entry-points."cot.runsomewhere.places".ssh = "cot.runsomewhere._places:Ssh"
entry-points."cot.runsomewhere.places".subinterpreter = "cot.runsomewhere._places:Subinterpreter"
entry-points."cot.runsomewhere.places".thread = "cot.runsomewhere._places:Thread"

[dependency-groups]
dev = [ { include-group = "lint" }, { include-group = "test" } ]
test = [
  "hypothesis>=6",
  "pytest>=8",
  "pytest-timeout>=2.3",
  "rsh-test-services",
  "trio>=0.27",
]
lint = [
  "mypy>=1.15",
  "nox>=2025",
  "pre-commit>=4",
]
docs = [
  # 2.0 removes the plugin and theme systems mkdocs-material is built on
  "mkdocs>=1.5,<2",
  "mkdocs-material>=9",
]
bench = [ "pytest-benchmark>=5" ]

[tool.hatch]
version.source = "vcs"
version.raw-options.version_scheme = "towncrier-fragments-zerover"
version.raw-options.fallback_version = "0.0.0"
build.targets.wheel.packages = [ "src/cot" ]

[tool.uv]
default-groups = [ "dev" ]
workspace.members = [ "testing/rsh_test_services" ]
sources.rsh-test-services = { workspace = true }

[tool.ruff]
line-length = 88
src = [ "src", "testing" ]
lint.extend-select = [
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "FA",   # flake8-future-annotations
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "NPY",  # NumPy specific rules
  "PD",   # pandas-vet
  "PERF", # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "YTT",  # flake8-2020
]
lint.ignore = [
  "ISC001",  # conflicts with the formatter
  "PLR09",   # complexity counts, as the Scientific Python guide leaves them
  "PLR2004", # magic values, likewise
  "SIM117",  # nested blocks are deliberate: each is the scope of one resource
]
# handlers and sent functions take `channel` whether they use it or not
lint.per-file-ignores."testing/**" = [ "ARG" ]
# noisy_echo prints on purpose: the protocol must survive it
lint.per-file-ignores."testing/rsh_test_services/**" = [ "ARG", "T20" ]
lint.isort.known-first-party = [ "cot", "rsh_test_services" ]

[tool.pytest]
ini_options.minversion = "8"
ini_options.addopts = [ "-ra", "--strict-config", "--strict-markers" ]
ini_options.log_level = "INFO"
ini_options.testpaths = [ "testing" ]
ini_options.norecursedirs = [ ".*", "rsh_test_services" ]
ini_options.xfail_strict = true
ini_options.timeout = 60
ini_options.filterwarnings = [ "error" ]

[tool.mypy]
python_version = "3.10"
files = [ "src" ]
strict = true
warn_unreachable = true
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool" ]
# optional, built from speedups/, and absent where mypy runs
overrides = [ { module = "_cot_runsomewhere_speedups", ignore_missing_imports = true } ]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
template = "changelog.d/template.md"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/cogs-of-testing/cot.runsomewhere/issues/{issue})"
underlines = [ "", "", "" ]

[[tool.towncrier.type]]
directory = "major"
name = "Major Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecation"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true
